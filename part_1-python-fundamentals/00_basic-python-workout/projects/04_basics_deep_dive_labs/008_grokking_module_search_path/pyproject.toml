[project]
name = "008_grokking_module_search"
version = "0.1.0"
description = "Lab 008: Grokking Module Search Path."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mymath"]

[dependency-groups]
dev = [
  "ruff>=0.14.8",
]

[tool.ruff]

ignore = [
  "T201", # Allow print statements
]

# Enable all rules
select = ["ALL"]

# Specific per-file-ignores for the tests directory
per-file-ignores = { "tests/**/*.py" = ["S101"] } # Allow assert in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
mymath = { path = "../../../../../../mymath", editable = true }
