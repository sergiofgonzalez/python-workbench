[project]
name = "custom-typed-list"
version = "0.1.0"
description = "Typed list implementation in Python."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergio F. Gonzalez", email = "sergio.f.gonzalez@gmail.com" },
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.8",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
]

[project.scripts]
custom-typed-list = "typedlist.main:main"

[project.urls]
Repository = "https://github.com/sergiofgonzalez/python-workbench"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "typedlist"

[tool.ruff]
ignore = [
    "T201", # Allow print statements
]

# Enable all rules
select = ["ALL"]

# Specific per-file-ignores for the tests directory
per-file-ignores = { "tests/**/*.py" = [
    "S101", # Allow assert in tests
    "PLR2004", # Allow len() comparisons in tests
], "main.py" = [
    "S101", # Allow assert in main application
] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--verbosity=3 --cov --cov-report=html"
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]
