[project]
name = "999_template"
version = "0.1.0"
description = "Lab 999: A template project for Python labs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oxyde>=0.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]

[tool.ruff]

ignore = [
  "T201", # Allow print statements
]

# Enable all rules
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"


