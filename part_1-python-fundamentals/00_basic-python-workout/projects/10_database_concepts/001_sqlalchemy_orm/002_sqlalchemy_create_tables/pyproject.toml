[project]
name = "002_sqlalchemy_create_tables"
version = "0.1.0"
description = "Illustrates the basics of the MetaData object to create tables in the database."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergio F. Gonzalez", email = "sergio.f.gonzalez@gmail.com" },
]
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0.48"]

[dependency-groups]
dev = ["ruff>=0.15.0"]

[tool.ruff]

ignore = [
    "T201", # Allow print statements
]

# Enable all rules
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

