[project]
name = "009_langchain_mcp_hello"
version = "0.1.0"
description = "Illustrates how to create your own mcp server that is then used by a LangChain agent"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergio F. Gonzalez", email = "sergio.f.gonzalez@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.2.18",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "mcp>=1.27.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tavily>=1.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.34",
]

[tool.ruff]

ignore = [
    "T201", # Allow print statements
    "T203", # Allow pprint statements
]

# Enable all rules
select = ["ALL"]

# Specific per-file-ignores for the tests directory
per-file-ignores = { "tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow len() comparisons in tests
], "main.py" = [
    "S101", # Allow assert in main application
] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--verbosity=3 --cov --cov-report=html"
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]
